name: Keep Supabase Awake

on:
  schedule:
    # Runs every 3 days at 12:00 UTC (well within the 7-day inactivity pause window)
    - cron: '0 12 */3 * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab anytime

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive heartbeat ping to Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://pgwpydahkdtngghyjedd.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_RE7Z6o13iGD3Ghjn2S6rGA_nnwFcGaq' }}
        run: |
          echo "Sending keep-alive ping to Supabase..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/sessions?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")

          echo "Response HTTP Status: ${HTTP_STATUS}"

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Supabase is active and healthy! Inactivity timer refreshed."
            exit 0
          else
            echo "⚠️ Warning: Expected HTTP 200, received ${HTTP_STATUS}."
            exit 1
          fi
